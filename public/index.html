<!doctype html>
<html lang="fr">
  <head>
    <script>
      try {
        const stored = localStorage.getItem('petitbac.theme');
        const theme = stored === 'light' || stored === 'dark' ? stored : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.music = localStorage.getItem('petitbac.music') === '1' ? 'on' : 'off';
      } catch { document.documentElement.dataset.theme = 'dark'; document.documentElement.dataset.music = 'off'; }
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#100e1c">
    <meta name="description" content="Petit Bac par Poséidon - Del'Hiver. Crée une partie, invite tes amis et joue en direct.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap&subset=latin" rel="stylesheet">
    <style>
      :root{color-scheme:dark;background:#100e1c;color:#f8f6ff;font-family:'Inter',system-ui,sans-serif}html[data-theme="light"]{color-scheme:light;background:#f4f1fa;color:#1c1730}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100e1c}html[data-theme="light"],html[data-theme="light"] body{background:#f4f1fa;color:#1c1730}body{min-height:100svh}button,input{font:inherit}button{color:inherit}#app{min-height:100svh}#update-gate[hidden]{display:none !important}#update-gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:rgba(16,14,28,.94)}html[data-theme="light"] #update-gate{background:rgba(244,241,250,.94)}#update-gate .update-card{width:min(100%,420px);padding:28px 22px;border:1px solid rgba(204,192,245,.2);border-radius:22px;background:#171328;text-align:center}html[data-theme="light"] #update-gate .update-card{background:#fff;border-color:rgba(36,24,68,.12);color:#1c1730}#update-gate .update-kicker{margin:0 0 8px;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9d93c9}#update-gate h1{margin:0;font:700 32px 'Space Grotesk',sans-serif}#update-gate p{margin:12px 0 0;color:#ded8ec;line-height:1.5}html[data-theme="light"] #update-gate p{color:#5c5672}#update-gate button{margin-top:22px;width:100%;border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(100deg,#a47aff,#e987c7);color:#171020;font-weight:800;cursor:pointer}#update-gate button:disabled{opacity:.7;cursor:progress}#update-gate button:hover,#update-gate button:active{transform:none}
    </style>
    <link rel="preload" href="/css/app.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/css/app.css"></noscript>
    <link rel="preload" href="/css/animations.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/css/animations.css"></noscript>
    <link rel="preload" href="/css/splash.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/css/splash.css"></noscript>
    <link rel="preload" href="/css/controls.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/css/controls.css"></noscript>
    <link rel="preload" href="/css/inter.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/css/inter.css"></noscript>
    <title>Poséidon - Del'Hiver · Petit Bac</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>
    <div id="app" aria-live="polite"></div>
    <div id="update-gate" hidden role="dialog" aria-modal="true" aria-labelledby="update-title">
      <div class="update-card">
        <p class="update-kicker">Poséidon · Del'Hiver</p>
        <h1 id="update-title">Mise à jour</h1>
        <p>Une nouvelle version est prête. Installe-la pour continuer. Tes salons restent en place, sans vider le cache du téléphone.</p>
        <button type="button" id="update-now">Mettre à jour</button>
        <p id="update-error" hidden>La mise à jour n’a pas abouti. Réessaie avec du réseau.</p>
      </div>
    </div>
    <script type="module" src="/js/app.js"></script>
    <script>
      const UPDATE_SHELL = ['/', '/index.html', '/version.json', '/manifest.webmanifest', '/css/app.css', '/css/animations.css', '/css/splash.css', '/css/controls.css', '/css/inter.css', '/js/app.js', '/js/version.js', '/js/api.js', '/js/ui.js', '/js/inter-session.js', '/js/inter-audio.js', '/js/screens/home.js', '/js/screens/setup.js', '/js/screens/room.js', '/js/screens/inter.js', '/js/dict.js', '/js/corrector.js', '/js/i18n/fr.json', '/sw.js', '/icons/icon-192.png', '/icons/icon-512.png', '/icons/icon-maskable.png'];
      const appliedKey = 'petitbac.appliedVersion';
      let remote = '';
      const gate = document.getElementById('update-gate');
      function showUpdate() {
        gate.hidden = false;
        document.getElementById('update-now').focus();
      }
      async function checkVersion() {
        try {
          const response = await fetch('/version.json', { cache: 'no-store' });
          if (!response.ok) return;
          remote = (await response.json()).version || '';
        } catch { return; }
        if (!remote) return;
        if (localStorage.getItem(appliedKey) !== remote) showUpdate();
      }
      document.getElementById('update-now').addEventListener('click', async () => {
        const button = document.getElementById('update-now');
        const error = document.getElementById('update-error');
        button.disabled = true;
        button.textContent = 'Mise à jour…';
        error.hidden = true;
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(reg => reg.unregister()));
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
          }
          const results = await Promise.all(UPDATE_SHELL.map(async url => {
            const response = await fetch(url, { cache: 'reload' });
            return response.ok;
          }));
          if (!results[UPDATE_SHELL.indexOf('/js/app.js')] || !results[UPDATE_SHELL.indexOf('/version.json')]) throw new Error('incomplete');
          localStorage.setItem(appliedKey, remote);
          const next = new URL(location.href);
          next.searchParams.set('maj', String(Date.now()));
          location.replace(next.href);
        } catch {
          button.disabled = false;
          button.textContent = 'Mettre à jour';
          error.hidden = false;
        }
      });
      checkVersion();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
      window.addEventListener('pageshow', checkVersion);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', event => { if (event.data?.type === 'UPDATE_READY') checkVersion(); });
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').then(reg => reg.update()).catch(() => {}));
      }
    </script>
  </body>
</html>
