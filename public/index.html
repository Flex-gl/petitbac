    <script>
      try {
        const stored = localStorage.getItem('petitbac.theme');
        const theme = stored === 'light' || stored === 'dark' ? stored : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.music = localStorage.getItem('petitbac.music') === '0' ? 'off' : 'on';
      } catch { document.documentElement.dataset.theme = 'dark'; document.documentElement.dataset.music = 'on'; }
    </script>

      :root{color-scheme:dark;background:#121318;color:#f8f6ff;font-family:'Inter',system-ui,sans-serif}html[data-theme="light"]{color-scheme:light;background:#f3f0fa;color:#1c1914}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#121318}html[data-theme="light"],html[data-theme="light"] body{background:#f3f0fa;color:#1c1914}body{min-height:100svh}.skip-link{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip-link:focus{position:fixed;z-index:300;top:1rem;left:1rem;width:auto;height:auto;margin:0;clip:auto;overflow:visible;padding:.8rem 1rem;background:#1a1528;color:#f3f0fa;border-radius:12px}button,input{font:inherit}button{color:inherit}#app{min-height:100svh}#update-gate[hidden]{display:none !important}#update-gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:rgba(16,22,20,.94)}html[data-theme="light"] #update-gate{background:rgba(246,241,231,.94)}#update-gate .update-card{width:min(100%,420px);padding:28px 22px;border:1px solid rgba(204,192,245,.2);border-radius:22px;background:#1e1f25;text-align:center}html[data-theme="light"] #update-gate .update-card{background:#fff;border-color:rgba(36,24,68,.12);color:#1c1914}#update-gate .update-kicker{margin:0 0 8px;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9d93c9}#update-gate h1{margin:0;font:700 32px 'Space Grotesk',sans-serif}#update-gate p{margin:12px 0 0;color:#ded8ec;line-height:1.5}html[data-theme="light"] #update-gate p{color:#5c5672}#update-gate button{margin-top:22px;width:100%;border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(100deg,#a078ff,#03b5d3);color:#171020;font-weight:800;cursor:pointer}#update-gate button:disabled{opacity:.7;cursor:progress}#update-gate button:hover,#update-gate button:active{transform:none}

  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>
    <div id="app" aria-live="polite"></div>
    <div id="update-gate" hidden role="dialog" aria-modal="true" aria-labelledby="update-title">
      <div class="update-card">
        <p class="update-kicker">Poséidon · Del'Hiver</p>
        <h1 id="update-title">Mise à jour</h1>
        <p>Une nouvelle version est prête. Installe-la pour continuer. Tes salons restent en place, sans vider le cache du téléphone.</p>
        <button type="button" id="update-now">Mettre à jour</button>
        <p id="update-error" hidden>La mise à jour n’a pas abouti. Réessaie avec du réseau.</p>
      </div>
    </div>
    <script type="module" src="/js/app.js"></script>
    <script>
      const UPDATE_SHELL = ['/', '/index.html', '/version.json', '/manifest.webmanifest', '/og.jpg', '/css/app.css', '/css/animations.css', '/css/splash.css', '/css/controls.css', '/css/inter.css', '/css/quiz.css', '/js/app.js', '/js/version.js', '/js/api.js', '/js/ui.js', '/js/inter-session.js', '/js/inter-audio.js', '/js/fireworks.js', '/js/kombo.js', '/js/quiz-session.js', '/js/screens/home.js', '/js/screens/setup.js', '/js/screens/room.js', '/js/screens/inter.js', '/js/screens/quiz.js', '/js/screens/guide.js', '/js/dict.js', '/js/corrector.js', '/js/i18n/fr.json', '/sw.js', '/audio/fond.mp3', '/covers/petitbac.jpg', '/covers/inter.jpg', '/covers/quiz.jpg', '/icons/mark.png', '/icons/icon-192.png', '/icons/icon-512.png', '/icons/icon-maskable.png', '/icons/apple-touch-icon.png'];
      const appliedKey = 'petitbac.appliedVersion';
      let remote = '';
      const gate = document.getElementById('update-gate');
      function showUpdate() {
        gate.hidden = false;
        document.getElementById('update-now').focus();
      }
      async function checkVersion() {
        try {
          const response = await fetch('/version.json', { cache: 'no-store' });
          if (!response.ok) return;
          remote = (await response.json()).version || '';
        } catch { return; }
        if (!remote) return;
        if (localStorage.getItem(appliedKey) !== remote) showUpdate();
      }
      document.getElementById('update-now').addEventListener('click', async () => {
        const button = document.getElementById('update-now');
        const error = document.getElementById('update-error');
        button.disabled = true;
        button.textContent = 'Mise à jour…';
        error.hidden = true;
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(reg => reg.unregister()));
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
          }
          const results = await Promise.all(UPDATE_SHELL.map(async url => {
            const response = await fetch(url, { cache: 'reload' });
            return response.ok;
          }));
          if (!results[UPDATE_SHELL.indexOf('/js/app.js')] || !results[UPDATE_SHELL.indexOf('/version.json')]) throw new Error('incomplete');
          localStorage.setItem(appliedKey, remote);
          const next = new URL(location.href);
          next.searchParams.set('maj', String(Date.now()));
          location.replace(next.href);
        } catch {
          button.disabled = false;
          button.textContent = 'Mettre à jour';
          error.hidden = false;
        }
      });
      checkVersion();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
      window.addEventListener('pageshow', checkVersion);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', event => { if (event.data?.type === 'UPDATE_READY') checkVersion(); });
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').then(reg => reg.update()).catch(() => {}));
      }
    </script>
  </body>
